name: CI

# Mirrors the local scripts in weekly-tracker/package.json:
#   npm ci  ->  npm run lint  ->  npm run build  ->  npm test
# The app lives in the weekly-tracker/ subfolder (working-directory below).

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: weekly-tracker

    # Dummy, non-secret placeholders. `vite build` bundles the app statically and
    # never contacts Supabase at build time, so these only satisfy any
    # import.meta.env.VITE_* references during the build. Real values live only in
    # .env.local (local) and GitHub Secrets (e2e, below) — never in this file.
    env:
      VITE_SUPABASE_URL: https://dummy.supabase.co
      VITE_SUPABASE_ANON_KEY: dummy-anon-key-not-real

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: weekly-tracker/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Lint is BLOCKING (M1.5): the 86 pre-existing errors were driven to 0.
      # Remaining lint output is warnings only (set-state-in-effect, exhaustive-deps),
      # which do not fail `eslint`. Any new error will fail CI.
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

  # ───────────────────────────────────────────────────────────────────────────
  # E2E (Playwright) — DISABLED. It needs a real Supabase project + seeded test
  # accounts, so it cannot run on a stock runner without secrets and a live DB.
  #
  # To enable later:
  #   1. Add repo Secrets (Settings > Secrets and variables > Actions):
  #        VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY
  #   2. Uncomment the job below.
  #
  # e2e:
  #   runs-on: ubuntu-latest
  #   defaults:
  #     run:
  #       working-directory: weekly-tracker
  #   env:
  #     VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  #     VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
  #     SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: '20'
  #         cache: npm
  #         cache-dependency-path: weekly-tracker/package-lock.json
  #     - run: npm ci
  #     - run: npx playwright install --with-deps chromium
  #     - run: npm run test:e2e
