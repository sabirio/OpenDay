name: CI

on:
  pull_request:
    branches: [main]
  push:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: weekly-tracker
    env:
      HAS_SUPABASE_APP_ENV: ${{ secrets.VITE_SUPABASE_URL != '' && secrets.VITE_SUPABASE_ANON_KEY != '' }}
      HAS_E2E_ENV: ${{ secrets.VITE_SUPABASE_URL != '' && secrets.VITE_SUPABASE_ANON_KEY != '' && secrets.E2E_ADMIN_EMAIL != '' && secrets.E2E_ADMIN_PASSWORD != '' && secrets.E2E_PM_EMAIL != '' && secrets.E2E_PM_PASSWORD != '' && secrets.E2E_CONTRACTOR_EMAIL != '' && secrets.E2E_CONTRACTOR_PASSWORD != '' && secrets.E2E_VIEWER_EMAIL != '' && secrets.E2E_VIEWER_PASSWORD != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: weekly-tracker/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Architecture guard
        run: npm run check:architecture

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Install Playwright browser
        if: ${{ env.HAS_E2E_ENV == 'true' }}
        run: npx playwright install --with-deps chromium

      - name: Serve built app
        if: ${{ env.HAS_E2E_ENV == 'true' }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm run preview -- --host 127.0.0.1 --port 5173 > preview.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then
              echo "Preview server is ready"
              exit 0
            fi
            sleep 1
          done
          cat preview.log
          exit 1

      - name: E2E P0 real flow
        if: ${{ env.HAS_E2E_ENV == 'true' }}
        env:
          PLAYWRIGHT_SKIP_WEBSERVER: '1'
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_PM_EMAIL: ${{ secrets.E2E_PM_EMAIL }}
          E2E_PM_PASSWORD: ${{ secrets.E2E_PM_PASSWORD }}
          E2E_CONTRACTOR_EMAIL: ${{ secrets.E2E_CONTRACTOR_EMAIL }}
          E2E_CONTRACTOR_PASSWORD: ${{ secrets.E2E_CONTRACTOR_PASSWORD }}
          E2E_VIEWER_EMAIL: ${{ secrets.E2E_VIEWER_EMAIL }}
          E2E_VIEWER_PASSWORD: ${{ secrets.E2E_VIEWER_PASSWORD }}
        run: npm run test:e2e:ci

      - name: Skip E2E notice
        if: ${{ env.HAS_SUPABASE_APP_ENV == 'true' && env.HAS_E2E_ENV != 'true' }}
        run: echo "Skipping E2E because one or more E2E_* test account secrets are not configured."

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            weekly-tracker/test-results
            weekly-tracker/playwright-report
            weekly-tracker/preview.log
          if-no-files-found: ignore
